<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Monitoring Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f5f7fa;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        #machines {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .machine {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgb(0 0 0 / 0.1);
            padding: 20px;
            width: 320px;
        }

        .machine h2 {
            margin-top: 0;
            font-weight: 600;
            color: #0066cc;
        }

        .stats {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .stats strong {
            color: #444;
        }

        canvas {
            width: 100% !important;
            height: 150px !important;
        }
    </style>
</head>

<body>
    <h1>💻 Monitoring des machines (Reactive)</h1>
    <div id="machines"></div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const machines = {};
        const charts = {}; // To keep track of Chart instances per machine
        const maxDataPoints = 30; // number of points shown on the chart

        const ws = new WebSocket("ws://localhost:6789");

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: "dashboard" }));
        };

        ws.onmessage = event => {
            const data = JSON.parse(event.data);
            const id = data.identifier;

            let block = machines[id];
            if (!block) {
                // Create machine block
                block = document.createElement('div');
                block.className = 'machine';
                block.id = `machine-${id}`;

                block.innerHTML = `
                    <h2>🖥 Machine ${id}</h2>
                    <div class="stats">
                        <p><strong>CPU total:</strong> <span class="cpu_total"></span>%</p>
                        <p><strong>RAM:</strong> <span class="memory_percent"></span>%</p>
                        <p><strong>Disk:</strong> <span class="disk_percent"></span>%</p>
                        <p><strong>Processus:</strong> <span class="process_count"></span></p>
                        <p><strong>Dernière mise à jour:</strong> <span class="timestamp"></span></p>
                    </div>
                    <canvas id="cpuChart-${id}"></canvas>
                `;

                machines[id] = block;
                document.getElementById('machines').appendChild(block);

                // Create Chart.js line chart for CPU usage over time
                const ctx = document.getElementById(`cpuChart-${id}`).getContext('2d');
                charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'CPU total (%)',
                            data: [],
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.2)',
                            fill: true,
                            tension: 0.3,
                        }]
                    },
                    options: {
                        responsive: true,
                        animation: false,
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                ticks: { stepSize: 10 }
                            }
                        },
                        plugins: {
                            legend: { display: true }
                        }
                    }
                });
            }

            // Update stats text
            block.querySelector('.cpu_total').textContent = data.cpu_total.toFixed(1);
            block.querySelector('.memory_percent').textContent = data.memory_percent.toFixed(1);
            block.querySelector('.disk_percent').textContent = data.disk_percent.toFixed(1);
            block.querySelector('.process_count').textContent = data.process_count;
            block.querySelector('.timestamp').textContent = new Date(data.timestamp * 1000).toLocaleTimeString();

            // Update Chart data
            const chart = charts[id];
            const nowLabel = new Date().toLocaleTimeString();

            if (chart.data.labels.length >= maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }

            chart.data.labels.push(nowLabel);
            chart.data.datasets[0].data.push(data.cpu_total);
            chart.update('none'); // 'none' disables animation for smooth real-time update
        };

        ws.onerror = error => {
            console.error("WebSocket error:", error);
        };

        ws.onclose = event => {
            console.log(`WebSocket closed: code=${event.code}, reason=${event.reason}`);
        };
    </script>
</body>

</html>
